name: Build and deploy NZDC

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - "scripts/**"
      - "search-overrides/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build MkDocs site
        run: python -m mkdocs build --clean --strict

      - name: Build weighted Lunr index
        run: npm run build:search

      - name: Install customised search runtime
        run: |
          cp search-overrides/main.js site/search/main.js
          cp search-overrides/worker.js site/search/worker.js

      - name: Verify generated site
        run: |
          test -s site/index.html
          test -s site/search/search_index.json
          test -s site/search/lunr.js
          test -s site/search/main.js
          test -s site/search/worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
