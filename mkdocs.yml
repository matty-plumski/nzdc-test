theme: 
  name: readthedocs
  highlightjs: false
  custom_dir: custom_theme/
  prev_next_buttons_location: none

markdown_extensions:
  - toc:
      permalink: True
      baselevel: 1
      toc_depth: 3
  
 
extra_css: [extra.css]

plugins:
  - search:
      min_search_length: 2
      indexing: sections
      prebuild_index: false

site_url: https://matty-plumski.github.io/nzdc-test/
use_directory_urls: true